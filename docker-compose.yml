services:
  db:
    image: postgres:15
    container_name: credit-db
    environment:
      - POSTGRES_USER=${DB_USER:?Set DB_USER in .env (cp .env.example .env)}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env (cp .env.example .env)}
      - POSTGRES_DB=${DB_NAME:?Set DB_NAME in .env (cp .env.example .env)}
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    container_name: ml-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend-service:
    build: ./backend-service
    container_name: spring-api
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - ML_SERVICE_URL=http://ml-api:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  frontend-service:
    build: ./frontend-service
    container_name: react-ui
    depends_on:
      backend-service:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  db_data:
